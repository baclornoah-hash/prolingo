<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prolingo — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  /* Page-specific layout only — shared tokens/colors come from style.css */
  body.login-body{
    display:grid; place-items:center; min-height:100vh;
    background: radial-gradient(circle at 20% 20%, #efe6fb, #fbf7f2 60%);
  }
  .login-card{
    width:100%; max-width:380px; background:#fff;
    border:1px solid var(--line); border-radius: var(--radius-lg);
    padding:32px; box-shadow: var(--shadow-pop);
  }
  .login-brand{ display:flex; align-items:center; gap:10px; margin-bottom:22px; }
  .login-brand .brand-mark{ transform:rotate(-6deg); }
  .login-brand strong{ font-family: var(--font-display); font-size:1.3rem; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:0.8rem; font-weight:700; margin-bottom:6px; color:var(--text-soft); }
  .field input{
    width:100%; padding:11px 14px; border:1px solid var(--line);
    border-radius:10px; font-size:0.9rem; font-family:inherit;
  }
  .field input:focus{ border-color: var(--violet); }
  .login-submit{
    width:100%; background: var(--violet); color:#fff; border:none;
    padding:12px; border-radius:10px; font-weight:700; font-size:0.9rem; margin-top:6px;
  }
  .login-error{
    background:#fdeceb; color:#b3311c; border-radius:8px; padding:9px 12px;
    font-size:0.8rem; margin-bottom:14px; display:none;
  }
  .login-foot{ margin-top:18px; font-size:0.78rem; color:var(--text-soft); text-align:center; }
  .role-hint{
    display:flex; gap:8px; margin-bottom:20px; font-size:0.72rem;
  }
  .role-hint span{
    flex:1; text-align:center; padding:8px 6px; border-radius:8px;
    background: var(--paper); border:1px solid var(--line); color:var(--text-soft);
  }
  .login-brand {
  display: flex;
  align-items: center;
  gap: 8px;
}

.login-brand .login-logo {
  width: 18px !important;
  height: 18px !important;
  min-width: 18px !important;
  min-height: 18px !important;
  max-width: 18px !important;
  max-height: 18px !important;
  object-fit: contain !important;
  display: block !important;
  flex: 0 0 18px !important;
  transform: none !important;
}
</style>
</head>
<body class="login-body">

  <div class="login-card">
  <div class="login-brand">
    <img
      src="file_00000000fab88207bc758e53b91261e5.png"
      alt="ProLingo logo"
      class="login-logo"
    >
    <strong>Prolingo</strong>
  </div>

    <div class="role-hint">
      <span>Admin</span><span>Teacher</span><span>Student</span>
    </div>

    <div class="login-error" id="loginError"></div>

    <form id="loginForm">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="username">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="login-submit">Sign in</button>
    </form>

    <p class="login-foot">One login for every role — the dashboard you land on depends on your account.</p>
  </div>

<!-- ============================================================
     FIREBASE
     Replace firebaseConfig with your own project's config
     (Firebase console → Project settings → General → Your apps)
     ============================================================ -->
<script type="module">
  import {
    auth,
    db
  } from "./firebase-config.js";

  import {
    signInWithEmailAndPassword
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  import {
    doc,
    getDoc
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const form = document.getElementById("loginForm");
  const errorBox = document.getElementById("loginError");
  const submitButton = form.querySelector("button[type='submit']");

  const ALLOWED_ROLES = new Set([
    "admin",
    "teacher",
    "student"
  ]);

  form.addEventListener("submit", async (event) => {
    event.preventDefault();

    hideError();
    setLoading(true);

    const email = document
      .getElementById("email")
      .value
      .trim()
      .toLowerCase();

    const password = document.getElementById("password").value;

    try {
      // Authenticate the account with Firebase.
      const credential = await signInWithEmailAndPassword(
        auth,
        email,
        password
      );

      const uid = credential.user.uid;

      // Read the user's profile and role.
      const userReference = doc(db, "users", uid);
      const userSnapshot = await getDoc(userReference);

      if (!userSnapshot.exists()) {
        throw new Error(
          "Your account exists, but no ProLingo profile has been assigned yet. Please contact an administrator."
        );
      }

      const userData = userSnapshot.data();

      const role = String(userData.role || "")
        .trim()
        .toLowerCase();

      const name = String(userData.name || "")
        .trim();

      if (!ALLOWED_ROLES.has(role)) {
        throw new Error(
          "This account has an invalid role. Please ask an administrator to correct your profile."
        );
      }

      if (!name) {
        throw new Error(
          "Your account profile is missing a name. Please ask an administrator to complete it."
        );
      }

      // Clear old values before saving the current account.
      sessionStorage.removeItem("prolingo_role");
      sessionStorage.removeItem("prolingo_name");

      sessionStorage.setItem("prolingo_role", role);
      sessionStorage.setItem("prolingo_name", name);

      window.location.replace("index.html");

    } catch (error) {
      console.error("ProLingo login error:", error);
      showError(friendlyError(error));
      setLoading(false);
    }
  });

  function setLoading(isLoading) {
    submitButton.disabled = isLoading;
    submitButton.textContent = isLoading
      ? "Signing in..."
      : "Sign in";
  }

  function showError(message) {
    errorBox.textContent = message;
    errorBox.style.display = "block";
  }

  function hideError() {
    errorBox.textContent = "";
    errorBox.style.display = "none";
  }

  function friendlyError(error) {
    const code = error.code || "";

    if (
      code.includes("wrong-password") ||
      code.includes("invalid-credential")
    ) {
      return "Incorrect email or password.";
    }

    if (code.includes("user-not-found")) {
      return "No account found with that email.";
    }

    if (code.includes("invalid-email")) {
      return "Please enter a valid email address.";
    }

    if (code.includes("user-disabled")) {
      return "This account has been disabled. Please contact an administrator.";
    }

    if (code.includes("too-many-requests")) {
      return "Too many attempts. Please try again later.";
    }

    if (code.includes("network-request-failed")) {
      return "Network error. Check your internet connection and try again.";
    }

    return error.message || "Something went wrong signing in.";
  }
</script>
  
</body>
</html>
